name: Update contribution graph

on:
  schedule:
    - cron: "30 */12 * * *"   # twice a day
  workflow_dispatch:           # run it manually from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/live_heatmap.py", "scripts/make_heatmap.py", ".github/workflows/heatmap.yml"]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the real contribution graph
        env:
          GH_USER: ${{ github.repository_owner }}
          # uses the optional GH_STATS_TOKEN secret (to count private work) if you added it
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/live_heatmap.py

      - name: Commit the new image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap.svg
          git diff --cached --quiet || (git commit -m "Update contribution graph" && git push)
